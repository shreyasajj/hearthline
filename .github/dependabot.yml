version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
      ktor:
        patterns: ['io.ktor:*']
      coroutines:
        patterns: ['org.jetbrains.kotlinx:kotlinx-coroutines-*']
      android-gradle:
        patterns: ['com.android.*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
