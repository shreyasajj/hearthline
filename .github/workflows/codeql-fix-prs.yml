name: CodeQL fix PRs
on:
  workflow_run:
    workflows: [CodeQL]
    branches: [master]
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-fix-prs
  cancel-in-progress: false
jobs:
  fix-prs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      security-events: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # Always execute the trusted default-branch script, never PR or artifact code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Request patches and open security PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/codeql_fix_prs.py
